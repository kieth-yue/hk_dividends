name: HK Stock Dividend Scanner

on:
  schedule:
    # 這是 UTC 的週日至週四 19:30，對應香港時間的週一至週五 03:30
    - cron: '30 19 * * 0-4'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pandas beautifulsoup4

      - name: Random delay (0-10 min)
        run: |
          DELAY=$((RANDOM % 600))
          echo "隨機等待 ${DELAY} 秒..."
          sleep ${DELAY}

      - name: Run Dividend Scanner
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python scanner_eastmoney.py
