name: HK Stock Dividend Scanner
on:
  schedule:
    # 每天香港時間 08:30 自動執行 (UTC 00:30)，週一至週五
    - cron: '30 0 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁手動點擊執行

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pandas beautifulsoup4

      - name: Run Dividend Scanner
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python scanner_eastmoney.py
